<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlugShelf</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <div class="brand"><span class="mark"></span><span><b>PLUG</b>SHELF</span></div>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search plugins, makers, categories" autocomplete="off" spellcheck="false">
      <button id="qClear" class="qclear" hidden title="Clear search">×</button>
      <kbd>/</kbd>
    </label>
    <button class="daw" id="daw" title="Connection to Ableton Live"><i></i><span>Live not connected</span></button>
    <nav class="tabs" id="tabs">
      <button data-v="lib" class="on">Library <em id="tLib">0</em></button>
      <button data-v="chains">Chains</button>
      <button data-v="health">Health <em id="tHealth">–</em></button>
      <button data-v="setup">Setup</button>
    </nav>
    <button class="icon" id="rescan" title="Rescan (F5)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    <button class="icon" id="pin" title="Always on top" hidden><svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"/></svg></button>
  </header>

  <div class="scanbar" id="scanbar" hidden>
    <div class="bar"><i id="scanFill"></i></div>
    <span id="scanText">Scanning…</span>
    <button class="link" id="scanStop">Stop</button>
  </div>
  <div class="scanbar" id="capbar" hidden>
    <div class="bar"><i id="capFill"></i></div>
    <span id="capText">Pictures…</span>
    <button class="link" id="capStop">Stop</button>
  </div>

  <section class="view" id="v-lib">
    <aside class="side" id="side"></aside>
    <main class="main" id="main">
      <div class="banner" id="banner" hidden></div>
      <div class="bar1">
        <button class="icon sm" id="sideToggle" title="Show / hide the sidebar (Cmd+Shift+S)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <h2 id="title">All plugins</h2><span class="count" id="count"></span>
        <div class="grow"></div>
        <div class="chips" id="fmts"></div>
        <label class="dbl" title="On: a click enlarges the tile and shows details, a double-click loads. Off: a click loads."><input type="checkbox" id="dblLoad"> Double-click to load</label>
        <select id="sort" title="Sort"></select>
        <button class="icon sm" id="picsToggle" title="Plugin pictures on the tiles"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button>
        <label class="zoom" title="Tile size (Ctrl + mouse wheel)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg><input type="range" id="zoom" min="140" max="320" step="2"></label>
      </div>
      <div id="shelfWrap" hidden><h3>Most loaded</h3><div class="shelf" id="shelf"></div></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
    <aside class="drawer" id="drawer" hidden></aside>
  </section>

  <section class="view" id="v-chains" hidden><div class="page wide" id="chains"></div></section>
  <section class="view" id="v-health" hidden><div class="page" id="health"></div></section>
  <section class="view" id="v-setup" hidden><div class="page" id="setup"></div></section>

  <div class="menu" id="menu" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <div class="toasts" id="toasts"></div>
</div>
<script src="categories.js"></script>
<script src="plugin-info.js"></script>
<script src="plugin-info-a.js"></script>
<script src="plugin-info-b.js"></script>
<script src="plugin-info-c.js"></script>
<script src="plugin-info-uad.js"></script>
<script src="originals.js"></script>
<script src="app.js"></script>
<script src="stock.js"></script>
<script src="kontakt.js"></script>
<script src="userracks.js"></script>
<script src="chain-data.js"></script>
<script src="chain-famous.js"></script>
<script src="chain-synth.js"></script>
<script src="chain-master.js"></script>
<script src="chain-more.js"></script>
<script src="chain-ua.js"></script>
<script src="chains.js"></script>
</body>
</html>
