<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlugShelf</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <div class="brand"><span class="mark"></span><span><b>PLUG</b>SHELF</span></div>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Plugins, Hersteller, Kategorien suchen" autocomplete="off" spellcheck="false">
      <button id="qClear" class="qclear" hidden title="Suche leeren">×</button>
      <kbd>/</kbd>
    </label>
    <button class="daw" id="daw" title="Verbindung zu Ableton Live"><i></i><span>Live nicht verbunden</span></button>
    <nav class="tabs" id="tabs">
      <button data-v="lib" class="on">Bibliothek <em id="tLib">0</em></button>
      <button data-v="health">Health <em id="tHealth">–</em></button>
      <button data-v="setup">Setup</button>
    </nav>
    <button class="icon" id="rescan" title="Neu scannen (F5)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    <button class="icon" id="pin" title="Immer im Vordergrund" hidden><svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"/></svg></button>
  </header>

  <div class="scanbar" id="scanbar" hidden>
    <div class="bar"><i id="scanFill"></i></div>
    <span id="scanText">Scanne…</span>
    <button class="link" id="scanStop">Stopp</button>
  </div>
  <div class="scanbar" id="capbar" hidden>
    <div class="bar"><i id="capFill"></i></div>
    <span id="capText">Bilder…</span>
    <button class="link" id="capStop">Stopp</button>
  </div>

  <section class="view" id="v-lib">
    <aside class="side" id="side"></aside>
    <main class="main" id="main">
      <div class="banner" id="banner" hidden></div>
      <div class="bar1">
        <h2 id="title">Alle Plugins</h2><span class="count" id="count"></span>
        <div class="grow"></div>
        <div class="chips" id="fmts"></div>
        <select id="sort" title="Sortierung"></select>
        <button class="icon sm" id="picsToggle" title="Plugin-Bilder auf den Kacheln"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button>
        <label class="zoom" title="Kachelgröße (Ctrl + Mausrad)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg><input type="range" id="zoom" min="140" max="320" step="2"></label>
      </div>
      <div id="shelfWrap" hidden><h3>Meist geladen</h3><div class="shelf" id="shelf"></div></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
    <aside class="drawer" id="drawer" hidden></aside>
  </section>

  <section class="view" id="v-health" hidden><div class="page" id="health"></div></section>
  <section class="view" id="v-setup" hidden><div class="page" id="setup"></div></section>

  <div class="menu" id="menu" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <div class="toasts" id="toasts"></div>
</div>
<script src="app.js"></script>
</body>
</html>
